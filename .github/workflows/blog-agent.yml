name: Blog Agent
run-name: "${{ github.event_name == 'issues' && format('Blog: {0}', github.event.issue.title) || github.event_name == 'schedule' && 'Blog: Scheduled run' || 'Blog: Manual run' }}"

on:
  # Run daily at 9am UTC
  schedule:
    - cron: '0 9 * * *'

  # Manual trigger from Actions tab. `label` lets a test issue (label it something
  # other than blog-link so the normal triggers ignore it) go through the pipeline.
  workflow_dispatch:
    inputs:
      label:
        description: 'Issue label to process'
        default: 'blog-link'
        required: false

  # Trigger when issue is labeled
  issues:
    types: [labeled]

jobs:
  generate-post:
    # Only run if labeled with 'blog-link' or triggered manually/scheduled
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'issues' && github.event.label.name == 'blog-link')

    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'blog/scripts/requirements.txt'

      - name: Install dependencies
        run: pip install -r blog/scripts/requirements.txt

      # Scrapling drives a real browser for pages that render with JavaScript or
      # block plain HTTP clients. Cached so most runs skip the download.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('blog/scripts/requirements.txt') }}

      - name: Install browser for Scrapling
        run: scrapling install

      - name: Run blog generator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO_NAME: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          EVENT_NAME: ${{ github.event_name }}
          ISSUE_LABEL: ${{ inputs.label || 'blog-link' }}
        run: python blog/scripts/generate_post.py

      - name: Open one PR per post
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: bash blog/scripts/open_post_prs.sh
